name: Publish

# Publish to npm when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
# Authenticates through npm trusted publishing (OIDC): the package's Trusted Publisher on npmjs.com
# names this repository and `publish.yml`, so no token is stored anywhere. Publishing itself stays a
# deliberate, human-initiated act — tagging — rather than firing on every push.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing, and the provenance attestation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships; Node 22 ships npm 10.
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Deterministic line endings + a git identity for the integration tests' repos.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: npm ci
      # Never publish a red build: run the same gate CI enforces, plus the build.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Guard against a tag/version mismatch — `v0.1.0` must match package.json's 0.1.0.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG}) does not match package.json version ${PKG}." >&2
            exit 1
          fi
      # prepublishOnly rebuilds; --access public publishes the package publicly. Trusted publishing
      # attaches the signed provenance attestation on its own, so --provenance is not needed.
      - run: npm publish --access public
