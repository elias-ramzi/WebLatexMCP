name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A ceiling on a HUNG job, not a slow one. vitest already bounds each test (90s on windows, 30s
    # elsewhere -- see vitest.config.ts), and that bound is what catches a test that runs long; it
    # does not catch a worker that never returns. On #169 `npm test` sat in-progress for 38 minutes
    # on windows-latest with that 90s budget in force, so no per-test timeout ever fired -- and the
    # identical tree passed the same job in 9m13s in a concurrent run of the same commit, which is
    # what tells a hang from the platform slowdown. Tightening testTimeout would not have caught it.
    # Without a job ceiling the default is GitHub's 360 minutes: six hours of runner time (windows
    # bills at 2x) and the PR pinned at BLOCKED throughout, because the stuck check is the most
    # recent one for its required context and branch protection reads that one. 25 is ~2.5x the
    # slowest successful windows run observed (5-10 minutes across the last 39). If a legitimate run
    # starts approaching it, find out what got slower rather than raising it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Deterministic line endings + a git identity for the integration tests' repos.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # Unit + integration tests use a local bare repo — no TeX, no secrets.
      - run: npm test

  tex-smoke:
    name: LaTeX compile smoke
    runs-on: ubuntu-latest
    # Same reasoning; here the cold-cache apt/TeX Live steps are the slow ones, not the tests.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Minimal TeX Live + latexmk via apt (the sample is a bare `article` with a manual
      # thebibliography, so no bibtex/biber is needed). Cached with cache-apt-pkgs-action so
      # warm runs restore the .debs instead of re-downloading; bump `version` to bust the cache.
      - name: Set up TeX Live
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          version: 1.0
      # cache-apt-pkgs-action restores the .deb payloads but skips dpkg's post-install, so on a
      # warm cache the pieces that post-install generates are missing and latexmk fails
      # intermittently (a cache miss installs cleanly and passes; a hit does not). Recreate them so
      # a cache hit matches a fresh install: the filename database (mktexlsr), the font maps
      # (updmap-sys), and — the one that caused the flaky *first* compile — the format files
      # (fmtutil-sys), which are built at install time and never shipped in the .debs.
      - name: Refresh TeX Live databases
        run: |
          sudo mktexlsr
          sudo updmap-sys
          sudo fmtutil-sys --all
      - run: npm ci
      - run: npm run test:smoke
