name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Deterministic line endings + a git identity for the integration tests' repos.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # Unit + integration tests use a local bare repo — no TeX, no secrets.
      - run: npm test

  tex-smoke:
    name: LaTeX compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Minimal TeX Live + latexmk via apt (the sample is a bare `article` with a manual
      # thebibliography, so no bibtex/biber is needed). Installed directly rather than via
      # a third-party action so the job doesn't depend on the repo's Actions allow-list.
      - name: Set up TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended
      - run: npm ci
      - run: npm run test:smoke
