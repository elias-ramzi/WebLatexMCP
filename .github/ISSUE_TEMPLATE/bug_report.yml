name: Bug report
description: Report a problem with WebLatexMCP
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

        ⚠️ **Never paste tokens or private project URLs.** Output is redacted by the server,
        but double-check any logs before sharing them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
      placeholder: |
        Steps to reproduce:
        1. ...
        2. ...

        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Token-free error output from the server (stderr) or the client, if any.
      render: shell
  - type: input
    id: os
    attributes:
      label: OS
      description: Include the architecture, and say so if this is WSL — paths and locking differ there.
      placeholder: 'macOS 15 (arm64) / Ubuntu 24.04 (WSL2, x86_64) / Windows 11'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: 'v22.x.x'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WebLatexMCP version / commit
      description: >-
        From the `server_info` tool. If it is not the latest on npm, say so — and if you run from a
        clone, give the commit SHA.
      placeholder: '0.5.0 (latest) or a commit SHA'
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      description: Which dependencies shipped with the server depends on this, so bugs do too.
      options:
        - npx web-latex-mcp
        - npm install -g web-latex-mcp
        - .mcpb bundle (Claude Desktop)
        - Claude Code plugin
        - From a clone of the repo
        - Other
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      description: Which app was connected to the server?
      options:
        - Claude Code (CLI)
        - Claude Code (VS Code extension)
        - Claude Code (JetBrains)
        - Claude Desktop
        - Cursor
        - Gemini CLI
        - GitHub Copilot
        - Other MCP client
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Which AI drove the session — tool-use behavior differs between models.
      placeholder: 'Claude Opus 5 / Mistral Large / …'
  - type: input
    id: tex
    attributes:
      label: TeX toolchain
      description: Only for compile-related bugs — the `doctor` tool reports all of it.
      placeholder: 'latexmk 4.86 · TeX Live 2025 · pdflatex, xelatex, lualatex'
  - type: dropdown
    id: remote
    attributes:
      label: Git remote
      description: Which host is the affected project on?
      options:
        - Overleaf
        - GitHub
        - GitLab
        - Other git remote
        - Local in-place project (no remote)
        - Not applicable
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
        - label: My logs/output contain no tokens or private URLs.
          required: true
